mortgage_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'map') }}"
      schema: staging
      host: "{{ env_var('DATABRICKS_HOST', env_var('DATABRICKS_SERVER_HOSTNAME', '')) }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
