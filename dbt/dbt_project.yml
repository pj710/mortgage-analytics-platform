name: "mortgage_analytics"
version: "1.0.0"
config-version: 2

profile: "mortgage_analytics"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# Canonical schema names for the medallion layers described in the project charter
# (section 18, "keep source adapters separate from the canonical model").
vars:
  bronze_schema: bronze
  staging_schema: staging
  core_schema: core

models:
  mortgage_analytics:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
